[workspace]
resolver = "2"
members = ["crates/automedon", "crates/automedon-cli"]
default-members = ["crates/automedon", "crates/automedon-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/indynull/automedon"
rust-version = "1.85"

[workspace.dependencies]
automedon = { path = "crates/automedon" }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
regex = "1"
rhai = { version = "1.21", features = ["sync", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
